services:
  qmd-like-rag:
    image: qmd-like-rag:0.4.0-intranet
    container_name: qmd-like-rag
    restart: unless-stopped
    command:
      - serve
      - --vault-root
      - /opt/data/phq/testVault
      - --config
      - /etc/qmd-like-rag/intranet.json
      - --host
      - 0.0.0.0
      - --port
      - "8781"
    volumes:
      - "${QMD_VAULT_HOST_PATH:?set QMD_VAULT_HOST_PATH}:/opt/data/phq/testVault:ro"
      - "${QMD_STATE_HOST_PATH:?set QMD_STATE_HOST_PATH}:/opt/data/phq/qmd-like-rag-state:rw"
      - "${QMD_CONFIG_HOST_PATH:?set QMD_CONFIG_HOST_PATH}:/etc/qmd-like-rag/intranet.json:ro"
    networks:
      - hermes-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8781/health'))['status']=='ok'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  hermes-runtime:
    external: true
    name: ${HERMES_DOCKER_NETWORK:-hermes-runtime}
